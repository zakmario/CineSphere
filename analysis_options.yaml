# Règles d'analyse de CinéSphère.
#
# Attention : un « Pull » FlutterFlow écrase ce fichier. Le restaurer avec
# `git checkout analysis_options.yaml` après chaque Pull.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    # Code généré par FlutterFlow (régénéré à chaque export, non modifiable).
    - lib/main.dart
    - lib/index.dart
    - lib/auth/**
    - lib/backend/**
    - lib/flutter_flow/flutter_flow_*.dart
    - lib/flutter_flow/form_field_controller.dart
    - lib/flutter_flow/keep_alive_wrapper.dart
    - lib/flutter_flow/lat_lng.dart
    - lib/flutter_flow/place.dart
    - lib/flutter_flow/uploaded_file.dart
    - lib/flutter_flow/nav/**
    - lib/pages/**
    - lib/login/**
    - lib/onboarding/**
    - lib/catalogue/**
    - lib/calendrier/**
    - lib/favoris/**
    - lib/actualites/**
    - lib/parametres/**
    - lib/media_detail/**
  errors:
    # FlutterFlow impose un bloc d'imports identique en tête de chaque
    # fichier de code personnalisé (« DO NOT REMOVE OR MODIFY »).
    unused_import: ignore
    unnecessary_import: ignore

linter:
  rules:
    unnecessary_string_escapes: false
